name: Import temperature fix

on:
  push:
    paths:
      - .github/workflows/import-tempfix.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import temperature fix
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793508189.e10748855b232480/wzAoTTPHzkkV/tempfix.tgz" -o /tmp/tempfix.tgz
          tar -xzf /tmp/tempfix.tgz -C .
          rm -f .github/workflows/import-tempfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add um-node.py .github/workflows/import-tempfix.yml
          git commit -m "Read all thermal and hwmon temperature sensors"
          git push
