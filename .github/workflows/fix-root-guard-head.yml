name: Use HEAD in root guard message

on:
  push:
    paths:
      - .github/workflows/fix-root-guard-head.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root guard message
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install.sh')
          s = p.read_text()
          s = s.replace(
              'https://github.com/ShahedPlayz/Universal-Monitor/raw/main/install-nonroot.sh',
              'https://github.com/ShahedPlayz/Universal-Monitor/raw/HEAD/install-nonroot.sh',
          )
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-root-guard-head.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh .github/workflows/fix-root-guard-head.yml
          git commit -m "Use HEAD in root guard message"
          git push
