name: Allow no-root node install without pip

on:
  push:
    paths:
      - .github/workflows/fix-nonroot-node.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch no-root node install
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install-nonroot.sh')
          s = p.read_text()
          old = '  stop_node >/dev/null 2>&1 || true\n  ensure_env || return 1\n  ( download_project )'
          new = '  stop_node >/dev/null 2>&1 || true\n  detect_env\n  ( download_project )'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/fix-nonroot-node.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-nonroot.sh .github/workflows/fix-nonroot-node.yml
          git commit -m "Do not require pip for no-root node install"
          git push
