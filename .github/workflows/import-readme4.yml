name: Import README update 4

on:
  push:
    paths:
      - .github/workflows/import-readme4.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793511359.4465c278aa1af26a/wpAWThqcvwy6/readme4.tgz" -o /tmp/readme4.tgz
          tar -xzf /tmp/readme4.tgz -C .
          rm -f .github/workflows/import-readme4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-readme4.yml
          git commit -m "Clean screenshot note and finalize README"
          git push
