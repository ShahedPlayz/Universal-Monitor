name: Import README update 5

on:
  push:
    paths:
      - .github/workflows/import-readme5.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793511540.0bc4a94cb94df676/wbAQT4qS17cc/readme5.tgz" -o /tmp/readme5.tgz
          tar -xzf /tmp/readme5.tgz -C .
          rm -f .github/workflows/import-readme5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-readme5.yml
          git commit -m "Reorder screenshots and add emoji headings"
          git push
