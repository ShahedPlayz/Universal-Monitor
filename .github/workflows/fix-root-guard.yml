name: Point root guard at no-root installer URL

on:
  push:
    paths:
      - .github/workflows/fix-root-guard.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root guard message
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install.sh')
          s = p.read_text()
          old = '  echo "  curl -fsSL https://raw.githubusercontent.com/ShahedPlayz/Universal-Monitor/main/install-nonroot.sh | bash" >&2'
          new = '  echo "  curl -fsSL https://github.com/ShahedPlayz/Universal-Monitor/raw/main/install-nonroot.sh | bash" >&2'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-root-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh .github/workflows/fix-root-guard.yml
          git commit -m "Point root guard at no-root installer URL"
          git push
