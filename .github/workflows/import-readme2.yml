name: Import README update

on:
  push:
    paths:
      - .github/workflows/import-readme2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793510715.50d34ca5d3db393f/wmAFTBqAoll0/readme2.tgz" -o /tmp/readme2.tgz
          tar -xzf /tmp/readme2.tgz -C .
          rm -f .github/workflows/import-readme2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-readme2.yml
          git commit -m "Remove Architecture section from README"
          git push
