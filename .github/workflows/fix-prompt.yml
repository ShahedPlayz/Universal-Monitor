name: Fix installer prompt

on:
  push:
    paths:
      - .github/workflows/fix-prompt.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix prompt formatting
        run: |
          set -euo pipefail
          python3 -c "p='install.sh'; s=open(p).read(); s=s.replace('read_line choice \"  ❯ Select option %b[0-4]%b: \"', 'read_line choice \"  ❯ Select option [0-4]: \"'); open(p,'w').write(s)"
          rm -f .github/workflows/fix-prompt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh .github/workflows/fix-prompt.yml
          git commit -m "Fix installer menu prompt formatting"
          git push
