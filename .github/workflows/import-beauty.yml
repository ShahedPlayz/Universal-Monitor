name: Import beauty update

on:
  push:
    paths:
      - .github/workflows/import-beauty.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README and app.js update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793510517.aa00587e5d479889/w3A3ThqaLkip/beauty.tgz" -o /tmp/beauty.tgz
          tar -xzf /tmp/beauty.tgz -C .
          rm -f .github/workflows/import-beauty.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md website/static/app.js .github/workflows/import-beauty.yml
          git commit -m "Beautify README and remove nodes-connect panel"
          git push
