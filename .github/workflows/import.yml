name: Import project files

on:
  push:
    paths:
      - .github/workflows/import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and import project files
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793497565.6fc480396799d7bd/wWAdTZhkNwu9/um-repo.tgz" -o /tmp/um-repo.tgz
          tar -xzf /tmp/um-repo.tgz -C .
          rm -f .github/workflows/import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add um-node.py website/app.py website/static/app.js website/static/style.css website/templates/index.html .github/workflows/import.yml
          git commit -m "Import full agent and website files"
          git push
