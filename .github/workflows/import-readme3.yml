name: Import README update 3

on:
  push:
    paths:
      - .github/workflows/import-readme3.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793511325.45a6969b6f1dcfa9/wUARTpqxadh7/readme3.tgz" -o /tmp/readme3.tgz
          tar -xzf /tmp/readme3.tgz -C .
          rm -f .github/workflows/import-readme3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-readme3.yml
          git commit -m "Reorder screenshots and add emoji headings"
          git push
