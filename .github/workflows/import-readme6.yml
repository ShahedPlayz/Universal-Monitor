name: Import README update 6

on:
  push:
    paths:
      - .github/workflows/import-readme6.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import README update
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793512414.f661799c706a4dc5/wIAsTmq9GRfk/readme6.tgz" -o /tmp/readme6.tgz
          tar -xzf /tmp/readme6.tgz -C .
          rm -f .github/workflows/import-readme6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/import-readme6.yml
          git commit -m "Use Discord emoji images and emojies screenshot paths"
          git push
